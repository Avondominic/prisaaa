<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffeef3">
  <meta name="description" content="a little something for you">
  <title>a little something for you</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28C5 20 2 14 5 9c3-5 9-4 11 1 2-5 8-6 11-1 3 5 0 11-11 19z' fill='%23ff3d68' stroke='%232b1838' stroke-width='2.5'/%3E%3C/svg%3E">

  <link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/caveat.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/motion.css">

  <!-- content first, then the engine -->
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/reactions.js" defer></script>
  <script src="js/scenes.js" defer></script>
  <script src="js/intro.js" defer></script>
  <script src="js/opening.js" defer></script>
  <script src="js/reveal.js" defer></script>
  <script src="js/music.js" defer></script>
  <script src="js/song.js" defer></script>
  <script src="js/easter-egg.js" defer></script>
  <script src="js/parallax.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <noscript>
    <p class="noscript">this surprise needs JavaScript turned on ♡</p>
  </noscript>

  <!-- doodle sprite: draw once, <use> anywhere -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="d-sparkle" viewBox="0 0 34 34"><path d="M17 1c1 10 6 15 16 16-10 1-15 6-16 16-1-10-6-15-16-16 10-1 15-6 16-16z"/></symbol>
    <symbol id="d-heart" viewBox="0 0 26 24"><path d="M13 22C4 15 1 10 4 6c3-4 8-2 9 2 1-4 6-6 9-2 3 4 0 9-9 16z"/></symbol>
    <symbol id="d-swirl" viewBox="0 0 54 34"><path d="M3 30c6-18 19-20 18-9-1 10-13 6-6-4 7-9 22-11 36-14"/></symbol>
    <symbol id="d-arrow" viewBox="0 0 32 30"><path d="M2 3c12 1 22 7 24 21"/><path d="M19 19l7 6 3-9"/></symbol>
    <symbol id="d-wave" viewBox="0 0 120 30"><path d="M3 15c9-12 18-12 27 0s18 12 27 0 18-12 27 0 18 12 27 0"/></symbol>
    <symbol id="d-star" viewBox="0 0 34 34"><path d="M17 3l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.8v14.4a1 1 0 0 0 1.5.86l11.2-7.2a1 1 0 0 0 0-1.72L9.5 3.94A1 1 0 0 0 8 4.8z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4" fill="currentColor"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9.5v5h4l5 4.5v-14l-5 4.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9.5v5h4l5 4.5v-14l-5 4.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="d-loop" viewBox="0 0 150 60"><path d="M3 45c25 10 45 4 55-12 8-14-6-24-14-12-9 13 10 28 34 22 22-5 42-26 68-30" stroke-dasharray="2 9"/></symbol>
  </svg>

  <!-- screen-reader announcements (cat reactions, status) -->
  <p id="live" class="sr-only" aria-live="polite"></p>

  <main id="experience">

    <!-- ============================================================
         1 · INTRO
    ============================================================= -->
    <section class="scene scene--intro" data-scene="intro" aria-labelledby="intro-title" hidden>

      <!-- desktop-only decoration scattered around the composition -->
      <div class="intro__decor" aria-hidden="true">
        <span class="decor decor--1" data-depth="-16"><svg class="doodle doodle--accent doodle--filled doodle--drift" viewBox="0 0 34 34"><use href="#d-sparkle"/></svg></span>
        <span class="decor decor--2" data-depth="12"><svg class="doodle doodle--drift-slow" viewBox="0 0 26 24"><use href="#d-heart"/></svg></span>
        <span class="decor decor--3" data-depth="10"><svg class="doodle" viewBox="0 0 120 30"><use href="#d-wave"/></svg></span>
        <span class="decor decor--4" data-depth="-12"><svg class="doodle doodle--accent doodle--filled doodle--drift" viewBox="0 0 26 24"><use href="#d-heart"/></svg></span>
        <span class="decor decor--5" data-depth="8"><svg class="doodle doodle--drift-slow" viewBox="0 0 34 34"><use href="#d-star"/></svg></span>
        <span class="decor decor--6" data-depth="-8"><svg class="doodle doodle--filled doodle--drift" viewBox="0 0 34 34"><use href="#d-sparkle"/></svg></span>
        <span class="decor decor--7" data-depth="6"><svg class="doodle" viewBox="0 0 150 60"><use href="#d-loop"/></svg></span>
      </div>

      <div class="scene__inner intro__inner">

        <div class="intro__cat" data-stagger data-depth="5">
          <span class="tag intro__tag" data-text="intro.tag">psst</span>
          <span class="tape"></span>
          <div class="sticker">
            <img id="intro-cat" class="sticker__media" src="" alt="" width="460" height="460">
          </div>
          <svg class="doodle doodle--accent doodle--filled doodle--drift intro__sparkle" viewBox="0 0 34 34" aria-hidden="true"><use href="#d-sparkle"/></svg>
          <svg class="doodle doodle--drift-slow intro__heart" viewBox="0 0 26 24" aria-hidden="true"><use href="#d-heart"/></svg>
          <svg class="doodle intro__swirl" viewBox="0 0 54 34" aria-hidden="true"><use href="#d-swirl"/></svg>
        </div>

        <div class="intro__copy">
          <h1 id="intro-title" class="intro__title" data-stagger>HEY!!</h1>
          <p class="intro__line" data-stagger data-text="intro.line">I made something for you...</p>

          <div class="intro__choices" data-stagger>
            <p class="intro__hint hand" aria-hidden="true">
              <span data-text="intro.hint">(choose wisely)</span>
              <svg class="doodle intro__hint-arrow" viewBox="0 0 32 30"><use href="#d-arrow"/></svg>
            </p>
            <button class="btn btn--primary intro__yes" type="button" data-text="intro.yes">YES</button>
            <button class="btn intro__no" type="button" data-text="intro.no">no</button>
          </div>

          <p class="intro__reply hand" aria-live="polite" data-stagger></p>
        </div>
      </div>
    </section>

    <!-- ============================================================
         2 · OPENING
    ============================================================= -->
    <section class="scene" data-scene="opening" aria-label="opening your surprise" hidden>
      <div class="scene__inner opening__inner">
        <div class="opening__cat" data-stagger>
          <div class="sticker">
            <img id="opening-cat" class="sticker__media" src="" alt="" width="132" height="132">
          </div>
        </div>
        <p class="opening__text hand" data-stagger data-focus>
          <span data-text="opening.text">opening</span><span class="opening__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
        </p>
        <div class="opening__bar" data-stagger aria-hidden="true"><div class="opening__fill"></div></div>
      </div>
    </section>

    <!-- ============================================================
         3 · REVEAL — the payoff
    ============================================================= -->
    <section class="scene scene--reveal" data-scene="reveal" aria-labelledby="reveal-title" hidden>

      <!-- slow floating hearts & stars behind everything -->
      <div class="reveal__ambient" aria-hidden="true">
        <svg class="floaty floaty--1 doodle doodle--accent doodle--filled" viewBox="0 0 26 24"><use href="#d-heart"/></svg>
        <svg class="floaty floaty--2 doodle" viewBox="0 0 34 34"><use href="#d-star"/></svg>
        <svg class="floaty floaty--3 doodle doodle--filled" viewBox="0 0 34 34"><use href="#d-sparkle"/></svg>
        <svg class="floaty floaty--4 doodle" viewBox="0 0 26 24"><use href="#d-heart"/></svg>
        <svg class="floaty floaty--5 doodle doodle--accent doodle--filled" viewBox="0 0 34 34"><use href="#d-sparkle"/></svg>
        <svg class="floaty floaty--6 doodle doodle--accent doodle--filled" viewBox="0 0 26 24"><use href="#d-heart"/></svg>
        <svg class="floaty floaty--7 doodle" viewBox="0 0 34 34"><use href="#d-star"/></svg>
        <svg class="floaty floaty--8 doodle doodle--filled" viewBox="0 0 34 34"><use href="#d-sparkle"/></svg>
      </div>

      <div class="scene__inner reveal__inner">

        <div class="reveal__copy">
          <span class="tag reveal__kicker" data-text="reveal.kicker">surprise!!</span>
          <!-- visual title is split into letters by js/reveal.js; screen readers get the plain text -->
          <h2 id="reveal-title" class="reveal__title" data-focus>
            <span class="sr-only reveal__title-text"></span>
            <span class="reveal__title-visual" aria-hidden="true"></span>
          </h2>
          <p class="reveal__name"><span class="reveal__name-text" data-text="name">[NAME]</span></p>
        </div>

        <div class="reveal__cat" data-depth="4">
          <span class="tape tape--b"></span>
          <button id="reveal-cat" class="sticker reveal__sticker" type="button" aria-label="the birthday cat">
            <img class="sticker__media" src="" alt="" width="380" height="380">
          </button>
          <svg class="doodle doodle--accent doodle--filled reveal__spark reveal__spark--a" viewBox="0 0 34 34" aria-hidden="true"><use href="#d-sparkle"/></svg>
          <svg class="doodle reveal__spark reveal__spark--b" viewBox="0 0 34 34" aria-hidden="true"><use href="#d-sparkle"/></svg>
        </div>

        <ul class="reveal__goofy" aria-label="goofy pictures"></ul>
      </div>

      <!-- appears once the reveal has played; scrolling works just as well -->
      <button class="cue hand" type="button" hidden>
        <span data-text="reveal.more">there's more</span>
        <svg class="doodle cue__arrow" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 3v22M5 18l7 8 7-8"/></svg>
      </button>
    </section>

    <!-- ============================================================
         4 · SONG — "okay, now listen to this"
         Never autoplays. The player only starts on a press.
    ============================================================= -->
    <section class="scene scene--song" data-scene="song" aria-labelledby="song-heading" hidden>
      <div class="scene__inner song__inner">

        <div class="song__copy">
          <span class="tag song__kicker" data-stagger data-text="song.kicker">okay okay okay</span>
          <h2 id="song-heading" class="song__heading" tabindex="-1" data-stagger data-text="song.heading">now listen to this</h2>
        </div>

        <!-- the cassette: reels turn while playing, tape winds with progress -->
        <div class="song__deck" data-stagger>
          <span class="tape song__deck-tape"></span>
          <div class="cassette" aria-hidden="true">
            <svg class="cassette__art" viewBox="0 0 400 254">
              <rect x="3" y="3" width="394" height="248" rx="22" class="c-body"/>
              <g class="c-screws"><circle cx="20" cy="20" r="6"/><circle cx="380" cy="20" r="6"/><circle cx="20" cy="234" r="6"/><circle cx="380" cy="234" r="6"/></g>
              <rect x="34" y="24" width="332" height="152" rx="14" class="c-label"/>
              <rect x="34" y="150" width="332" height="10" class="c-stripe-a"/>
              <rect x="34" y="160" width="332" height="8" class="c-stripe-b"/>
              <rect x="100" y="88" width="200" height="56" rx="28" class="c-window"/>
              <circle cx="150" cy="116" r="24" class="c-spool c-spool--l"/>
              <circle cx="250" cy="116" r="24" class="c-spool c-spool--r"/>
              <g class="c-reel c-reel--l"><circle cx="150" cy="116" r="15" class="c-hub"/><path d="M150 103v6M161 122.5l-5-3M139 122.5l5-3" class="c-teeth"/></g>
              <g class="c-reel c-reel--r"><circle cx="250" cy="116" r="15" class="c-hub"/><path d="M250 103v6M261 122.5l-5-3M239 122.5l5-3" class="c-teeth"/></g>
              <path d="M92 251l18-46h180l18 46" class="c-foot"/>
              <circle cx="146" cy="230" r="7" class="c-hole"/><circle cx="254" cy="230" r="7" class="c-hole"/>
            </svg>
            <div class="cassette__label">
              <span class="cassette__side">A</span>
              <span class="cassette__title hand" data-text="song.title">[SONG TITLE]</span>
            </div>
          </div>
          <div class="song__cat">
            <div class="sticker"><img id="song-cat" class="sticker__media" src="" alt="" width="140" height="140"></div>
          </div>
        </div>

        <div class="player" data-stagger role="group" aria-labelledby="player-title">
          <div class="player__meta">
            <p id="player-title" class="player__title" data-text="song.title">[SONG TITLE]</p>
            <p class="player__artist" data-text="song.artist">[SONG ARTIST]</p>
          </div>

          <div class="player__main">
            <button class="player__play" type="button" aria-label="Play">
              <svg class="player__icon" aria-hidden="true"><use href="#i-play"/></svg>
            </button>
            <div class="player__progress">
              <input class="range player__seek" type="range" min="0" max="0" step="1" value="0" aria-label="Song position">
              <div class="player__times" aria-hidden="true"><span class="player__now">0:00</span><span class="player__dur">--:--</span></div>
            </div>
          </div>

          <div class="player__volume">
            <button class="player__mute" type="button" aria-label="Mute" aria-pressed="false">
              <svg aria-hidden="true"><use href="#i-vol"/></svg>
            </button>
            <input class="range player__vol" type="range" min="0" max="100" step="5" value="80" aria-label="Volume">
            <p class="player__hint hand" data-text="song.hint">(press play whenever you're ready — volume up)</p>
          </div>

          <p class="player__missing" hidden></p>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
